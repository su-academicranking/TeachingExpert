<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- 1. ชื่อเว็บไซต์ที่จะแสดงบน Google และ Tap เบราว์เซอร์ -->
  <title>ระบบค้นหารายชื่อผู้ทรงคุณวุฒิที่ได้รับรางวัลด้านการสอน</title>

  <!-- 2. Open Graph สำหรับแสดงรูปและข้อความเวลาแชร์ลง Facebook / LINE -->
  <meta property="og:title" content="ระบบค้นหารายชื่อผู้ทรงคุณวุฒิที่ได้รับรางวัลด้านการสอน" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1QdEWReQB6ujnKpX9O9q1Gx1i7akY9Wqb" />

  <!-- 5. Favicon และ Theme Color -->
  <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1QdEWReQB6ujnKpX9O9q1Gx1i7akY9Wqb">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="theme-color" content="#ffffff">
  
  <base target="_top">

  <!-- 6. CSS ตั้งค่าให้ WebApp แสดงผลเต็มหน้าจอสมบูรณ์แบบ -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbyvf-3Q8T0ElDbNoOsODA0wqSUd2Bo6S0OhY1USFik_zBV9rI97KtwEA1LsnNavZ2D5/exec"></iframe>
</body>
</html>
